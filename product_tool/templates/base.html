<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Карточки товаров{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">Карточки товаров <span>MVP</span></a>
      <nav aria-label="Основная навигация"><a href="/">Партии и загрузка</a></nav>

  <footer class="shell footer">Локальная версия · данные хранятся на этом компьютере</footer>
</body>
</html>
